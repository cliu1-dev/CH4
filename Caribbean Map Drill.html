<style>
/* Layout: wide chart-style map on the left, a study panel on the right; stacks on phones with the map scrolling sideways. */
:root {
  --bg: #e9f0f1;
  --panel: #ffffff;
  --ink: #12262c;
  --muted: #56696e;
  --line: #c9d6d8;
  --water: #b6d2d8;
  --land: #fbfaf5;
  --land-other: #d9dfdb;
  --border: #6f878c;
  --accent: #f0a634;
  --accent-soft: #f6c97f;
  --accent-ink: #6b4300;
  --ok: #23845a;
  --ok-soft: #cfeadb;
  --bad: #c2413a;
  --bad-soft: #f6d4d1;
  --warn: #9a6a00;
  --warn-soft: #fbecc8;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1a1e; --panel: #142429; --ink: #e4eeee; --muted: #93a8ac; --line: #28404a;
    --water: #1b3b45; --land: #33474c; --land-other: #24353a; --border: #7c979d;
    --accent: #f2b04a; --accent-soft: #a8742a; --accent-ink: #ffe2b0;
    --ok: #4cc28a; --ok-soft: #173d2d; --bad: #ef7a72; --bad-soft: #47201e; --warn: #f0c35a; --warn-soft: #3d3216;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1a1e; --panel: #142429; --ink: #e4eeee; --muted: #93a8ac; --line: #28404a;
  --water: #1b3b45; --land: #33474c; --land-other: #24353a; --border: #7c979d;
  --accent: #f2b04a; --accent-soft: #a8742a; --accent-ink: #ffe2b0;
  --ok: #4cc28a; --ok-soft: #173d2d; --bad: #ef7a72; --bad-soft: #47201e; --warn: #f0c35a; --warn-soft: #3d3216;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 4vw, 36px); line-height: 1.05; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
.tab { font: 700 14px/1 var(--font-body); color: var(--muted); background: transparent; border: 0; border-radius: 7px; padding: 10px 14px; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (min-width: 901px) { .mapbox { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); } }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
.mapbox { min-width: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--water); }
.mapscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
#map { display: block; width: 100%; min-width: 760px; height: auto; user-select: none; -webkit-user-select: none; }
.maphint { display: none; font-size: 13px; color: var(--muted); padding: 6px 12px; background: var(--panel); border-top: 1px solid var(--line); }
@media (max-width: 780px) { .maphint { display: block; } }

/* map layers */
.water { fill: var(--water); transition: fill .2s; }
.other { fill: var(--land-other); stroke: var(--border); stroke-width: .5; stroke-opacity: .6; }
.land { fill: var(--land); stroke: var(--border); stroke-width: .7; transition: fill .2s; }
.clickable .feat { cursor: pointer; }
.clickable .land:hover { fill: var(--accent-soft); }
.clickable .water:hover { fill: color-mix(in srgb, var(--water) 75%, var(--accent)); }
.feat.hl.land { fill: var(--accent); }
.feat.hl.water { fill: color-mix(in srgb, var(--water) 45%, var(--accent)); }
.feat.ok.land { fill: var(--ok); }
.feat.ok.water { fill: color-mix(in srgb, var(--water) 45%, var(--ok)); }
.feat.bad.land { fill: var(--bad); }
.feat.bad.water { fill: color-mix(in srgb, var(--water) 45%, var(--bad)); }
.feat.pulse { animation: pulse 1s ease-in-out 3; }
@keyframes pulse { 50% { opacity: .35; } }
.leader { stroke: var(--ink); stroke-width: 1.2; }
.anchor { fill: var(--ink); }
.mark circle { fill: var(--ink); stroke: var(--land); stroke-width: 2; }
.mark text { fill: var(--land); font: 700 12px var(--font-mono); text-anchor: middle; dominant-baseline: central; }
.mark.focus circle { fill: var(--accent); stroke: var(--ink); }
.mark.focus text { fill: var(--ink); }
.mark.ok circle { fill: var(--ok); }
.mark.bad circle { fill: var(--bad); }
.mark.q circle { fill: var(--accent); stroke: var(--ink); stroke-width: 2; }
.mark.q text { fill: var(--ink); font-size: 14px; }
.lab { font: 700 12.5px var(--font-body); fill: var(--ink); text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--land); stroke-width: 3.5px; stroke-linejoin: round; pointer-events: none; }
.lab.sea { font-style: italic; font-weight: 400; font-size: 15px; letter-spacing: .04em; stroke: var(--water); fill: color-mix(in srgb, var(--ink) 80%, var(--water)); }
.lab.on { fill: var(--accent-ink); }

/* panel */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.eyebrow { font: 700 12px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.panel h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.15; margin: 0; text-wrap: balance; }
.panel p { margin: 0; }
.muted { color: var(--muted); font-size: 14.5px; }
.btn { font: 700 15px/1 var(--font-body); border-radius: 8px; padding: 12px 16px; cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:hover { filter: brightness(1.1); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
button:focus-visible, input:focus-visible, .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input[type="text"] { width: 100%; font: 400 17px var(--font-body); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 11px 12px; }
input[type="text"]:focus { border-color: var(--ink); outline: none; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.stat { font: 500 13px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.fb { border-radius: 8px; padding: 10px 12px; font-size: 15px; }
.fb.ok { background: var(--ok-soft); color: var(--ink); border-left: 4px solid var(--ok); }
.fb.bad { background: var(--bad-soft); color: var(--ink); border-left: 4px solid var(--bad); }
.fb.warn { background: var(--warn-soft); color: var(--ink); border-left: 4px solid var(--warn); }
.fb b { font-weight: 700; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.1; }
.groups { display: grid; gap: 12px; }
.group h3 { margin: 0 0 6px; font: 700 12px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 400 14px/1 var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 8px 11px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #1d1300; }
.fact { min-height: 72px; border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; }
.fact strong { font-family: var(--font-display); font-size: 20px; display: block; }
.mnemo { background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 14.5px; }
.mnemo b { color: var(--ink); }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 14.5px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--ink); }
.answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 10px; }
@media (max-width: 900px) and (min-width: 560px) { .answers { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.ans { display: grid; grid-template-columns: 28px minmax(0, 1fr); align-items: center; gap: 6px; }
.ans label { font: 700 13px var(--font-mono); text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.ans input[type="text"] { font-size: 15px; padding: 8px 9px; }
.ans.ok input { border-color: var(--ok); background: var(--ok-soft); }
.ans.bad input { border-color: var(--bad); background: var(--bad-soft); }
.ans.warn input { border-color: var(--warn); background: var(--warn-soft); }
.ans .fix { grid-column: 2; font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.ans.bad .fix { color: var(--bad); }
.ans.warn .fix { color: var(--warn); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

function norm(s) {
  return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[.,'’]/g, '').replace(/\s+/g, ' ').trim().replace(/^the /, '');

  const t = norm(input);
  if (!t) return { st: 'bad', note: 'Blank.' };
  if (f.alts.map(norm).includes(t)) return { st: 'ok' };
  if (f.flagged && f.flagged[t]) return { st: 'warn', note: f.flagged[t] };
  const other = whoIs(input);
  if (other && other !== f) return { st: 'bad', note: `You wrote ${other.name}. This one is ${f.name}.` };
  const target = norm(f.name);
  const tol = target.length >= 10 ? 2 : target.length >= 4 ? 1 : 0;
  if (f.alts.some(a => lev(t, norm(a)) <= tol && norm(a).length >= 4)) return { st: 'warn', note: `Close. Check the spelling: ${f.name}.` };

}

      missed.add(cur); queue.splice(Math.min(3, queue.length), 0, cur);
      setShape(id, 'bad'); setShape(cur, 'hl pulse'); locked = true;
      msg = { st: 'bad', html: `<b>That's ${esc(byId[id].name)}.</b> ${esc(byId[cur].name)} is the one flashing. ${esc(byId[cur].fact)}` };
      render();
    }
  };
  const finish = () => {
    panel.innerHTML = `
      <p class="eyebrow">Find it</p>
      <h2>All 18 found</h2>
      <p class="big">${firstTry}/18</p>
      <p class="muted">found on the first click.${missed.size ? ' Watch out for: ' + [...missed].map(i => esc(byId[i].name)).join(', ') + '.' : ''}</p>
      <div class="row"><button class="btn" id="again">Go again</button></div>`;
    panel.querySelector('#again').addEventListener('click', find);
  };
  next();
}

/* ---------- Mock test ---------- */
function test() {
  const order = shuffle(F.map(f => f.id)); // order[i] has number i+1
  let graded = null;
  resetMap();
  order.forEach((id, i) => showMark(id, String(i + 1)));
  const best = store.get('best', null);
  panel.innerHTML = `
    <p class="eyebrow">Mock test</p>
    <h2>Name each number</h2>
    <p class="muted">Like the real thing: a numbered blank map, no word bank. Numbers change every time.${best != null ? ` Your best so far: <b>${best}/18</b>.` : ''}</p>
    <form id="tf" autocomplete="off">
      <div class="answers">${order.map((id, i) => `<div class="ans" id="a${i}"><label for="t${i}">${i + 1}</label><input type="text" id="t${i}" autocapitalize="words" autocorrect="off" spellcheck="false"><span class="fix" hidden></span></div>`).join('')}</div>
      <div class="row" style="margin-top:14px"><button class="btn" type="submit" id="gradeBtn">Grade my test</button><button class="btn ghost" type="button" id="newT">Shuffle numbers</button></div>
    </form>
    <div id="score"></div>`;
  const inputs = order.map((_, i) => panel.querySelector('#t' + i));
  inputs.forEach((inp, i) => {
    inp.addEventListener('focus', () => { if (!graded) { order.forEach(id => marks[id].classList.remove('focus')); marks[order[i]].classList.add('focus'); } });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && i < inputs.length - 1) { e.preventDefault(); inputs[i + 1].focus(); } });
  });
  panel.querySelector('#newT').addEventListener('click', test);
  panel.querySelector('#tf').addEventListener('submit', e => {
    e.preventDefault();
    if (graded) return test();
    let pts = 0; graded = [];
    order.forEach((id, i) => {
      const r = check(inputs[i].value, byId[id]), box = panel.querySelector('#a' + i), fix = box.querySelector('.fix');
      if (r.st !== 'bad') pts++; else graded.push(id);
      box.classList.add(r.st); inputs[i].readOnly = true;
      marks[id].setAttribute('class', 'mark ' + (r.st === 'bad' ? 'bad' : 'ok'));
      if (r.st !== 'ok') { fix.hidden = false; fix.textContent = r.st === 'warn' ? r.note : `Answer: ${byId[id].name}`; }
    });
    const prev = store.get('best', null); if (prev == null || pts > prev) store.set('best', pts);
    const pct = Math.round(pts / 18 * 100);
    panel.querySelector('#score').innerHTML = `<div class="fb ${pts === 18 ? 'ok' : pts >= 14 ? 'warn' : 'bad'}"><span class="big">${pts}/18</span> &nbsp;${pct}%<br>${pts === 18 ? 'Perfect. You are ready for Part II.' : 'Red numbers on the map are the ones to review. Yellow ones counted but need a fix.'}</div>`;
    panel.querySelector('#gradeBtn').textContent = 'Take a new test';
    if (graded.length) { const b = document.createElement('button'); b.className = 'btn ghost'; b.type = 'button'; b.textContent = 'Drill my misses'; b.addEventListener('click', () => drillSome(graded)); panel.querySelector('#tf .row').appendChild(b); }
  });
  mode.onMapClick = id => { const i = order.indexOf(id); if (i >= 0 && !graded) inputs[i].focus(); };
  svg.classList.add('clickable');
}
function drillSome(ids) { setMode('drill', ids); }

/* ---------- mode switching ---------- */
const MODES = { learn, drill, find, test };
function setMode(m, arg) {
  mode = {};
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.mode === m));
  store.set('mode', m);
  MODES[m](arg);
}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));
buildMap();
setMode(store.get('mode', 'learn') in MODES ? store.get('mode', 'learn') : 'learn');
</script>
